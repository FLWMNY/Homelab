---
services:

###############################
# RADARR
###############################

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    networks:
      - servarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Amsterdam
    volumes:
      - /mnt/appdata/radarr:/config
      - /mnt/media/movies:/movies #optional
      - /mnt/downloads:/downloads #optional
    ports:
      - 7878:7878
    restart: unless-stopped

###########################################################
# OVERSEERR
###########################################################

  overseerr:
    image: lscr.io/linuxserver/overseerr:latest
    container_name: overseerr
    networks:
      - servarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Amsterdam
    volumes:
      - /mnt/appdata/overseerr:/config
    ports:
      - 5055:5055
    restart: unless-stopped


###############################
# SONARR
###############################

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    networks:
      - servarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Amsterdam
    volumes:
      - /mnt/appdata/sonarr:/config
      - /mnt/media/series:/series #optional
      - /mnt/downloads:/downloads #optional
    ports:
      - 8989:8989
    restart: unless-stopped

###############################
# BAZARR
###############################

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    networks:
      - servarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Amsterdam
    volumes:
      - /mnt/appdata/bazarr:/config
      - /mnt/media/movies:/movies #optional
      - /mnt/media/series:/series #optional
    ports:
      - 6767:6767
    restart: unless-stopped

###############################
# PROWLARR
###############################

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    networks:
      - servarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Amsterdam
    volumes:
      - /mnt/appdata/prowlarr:/config
    ports:
      - 9696:9696
    restart: unless-stopped

###############################
# NZBGET
###############################

  nzbget:
    image: lscr.io/linuxserver/nzbget:latest
    container_name: nzbget
    networks:
      - servarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Amsterdam
    volumes:
      - /mnt/appdata/nzbget/config:/config
      - /mnt/downloads:/downloads #optional
    ports:
      - 6789:6789
    restart: unless-stopped

networks:
  servarr:
    driver: bridge
