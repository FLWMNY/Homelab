# Samba in LXC 105. Eén share "Bestanden", alleen voor gebruiker floriano.
# Data staat op de host in /mnt/nvme1n1/bestanden (in de container: /srv/bestanden).
[global]
   server role = standalone server
   server min protocol = SMB3
   map to guest = never
   restrict anonymous = 2
   disable netbios = yes
   smb ports = 445
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes
   log file = /var/log/samba/%m.log
   max log size = 1000

[Bestanden]
   path = /srv/bestanden
   valid users = floriano
   force user = floriano
   read only = no
   browseable = yes
   create mask = 0664
   directory mask = 0775
